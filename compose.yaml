
services:
  postgres:
    image: postgres:17
    container_name: qa-playground-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-setup:
    build: .
    restart: "no"

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}

    command: >
      sh -c "node scripts/migrate.js &&
             node scripts/seed.js"

    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    container_name: qa-playground-api
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      PORT: 3000

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      db-setup:
        condition: service_completed_successfully

  postgres-test:
    image: postgres:17
    profiles: ["testing"]
    environment:
      POSTGRES_USER: qa_test_user
      POSTGRES_PASSWORD: qa_test_password
      POSTGRES_DB: qa_playground_test

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_test_user -d qa_playground_test"]
      interval: 5s
      timeout: 5s
      retries: 5

    tmpfs:
      - /var/lib/postgresql/data

  db-setup-test:
    build:
      context: .
      target: production

    profiles: ["testing"]
    restart: "no"

    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: qa_test_user
      DB_PASSWORD: qa_test_password
      DB_NAME: qa_playground_test
      NODE_ENV: test

    command: node scripts/migrate.js

    depends_on:
      postgres-test:
        condition: service_healthy

  api-tests:
    build:
      context: .
      target: development

    profiles: ["testing"]
    restart: "no"

    environment:
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: qa_test_user
      DB_PASSWORD: qa_test_password
      DB_NAME: qa_playground_test
      NODE_ENV: test

    command: npm run test:docker

    depends_on:
      db-setup-test:
        condition: service_completed_successfully

volumes:
  postgres_data:
