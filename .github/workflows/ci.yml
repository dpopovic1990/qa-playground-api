
name: QA Playground API - CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run integration tests
        run: docker compose --env-file .env.ci --profile testing run --build --rm api-tests

      - name: Cleanup Docker environment
        if: always()
        run: docker compose --env-file .env.ci --profile testing down --volumes --remove-orphans
