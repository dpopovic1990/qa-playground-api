
openapi: 3.0.3

info:
  title: QA Playground API
  version: 1.0.0
  description: |
    Open-source REST API playground for QA engineers,
    test automation practice and backend learning.

servers:
  - url: http://localhost:3000
    description: Local development environment

tags:
  - name: Health
  - name: Users
  - name: Accounts
    description: Account management operations
  - name: Transactions
    description: Deposit and withdrawal operations

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        '200':
          description: API is running

  /api/v1/users:
    get:
      tags: [Users]
      summary: Get paginated users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: name
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, created_at]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Paginated users collection
        '400':
          description: Invalid query parameters

    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
      responses:
        '201':
          description: User created successfully
        '400':
          description: Validation error
        '409':
          description: User already exists

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: User found
        '400':
          description: Invalid user ID
        '404':
          description: User not found

  /api/v1/accounts:
    get:
      tags:
        - Accounts
      summary: Get all accounts
      description: Returns all accounts stored in PostgreSQL.
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  count:
                    type: integer

    post:
      tags:
        - Accounts
      summary: Create an account
      description: Creates a new account for an existing user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  pattern: '^[1-9][0-9]*$'
                  example: '16'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid user ID
        '404':
          description: User not found
        '500':
          description: Internal server error

  /api/v1/transactions:
    post:
      tags:
        - Transactions
      summary: Create a financial transaction
      description: |
        Processes a deposit or withdrawal for an existing account.

        The account balance update and transaction record
        are executed within a single PostgreSQL transaction.

        Row-level locking protects against conflicting concurrent updates.

        Amounts must be positive decimal strings with exactly two
        decimal places and must fit within NUMERIC(15,2).

        A deposit that would exceed the maximum account balance
        returns HTTP 409 Conflict.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountId
                - type
                - amount
              properties:
                accountId:
                  type: string
                  pattern: '^[1-9][0-9]*$'
                  example: '1'
                type:
                  type: string
                  enum:
                    - DEPOSIT
                    - WITHDRAWAL
                amount:
                  type: string
                  pattern: '^[0-9]+\.[0-9]{2}$'
                  example: '50.00'
      responses:
        '201':
          description: Transaction processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Invalid transaction data
        '404':
          description: Account not found
        '409':
          description: Insufficient funds
        '500':
          description: Internal server error

    get:
      tags:
        - Transactions
      summary: Get transaction history
      description: |
        Returns a paginated collection of transactions.

        Supports filtering by account ID and transaction type,
        as well as sorting by ID, amount, or creation date.

        The endpoint uses LIMIT/OFFSET pagination.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

        - name: accountId
          in: query
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'

        - name: type
          in: query
          schema:
            type: string
            enum:
              - DEPOSIT
              - WITHDRAWAL

        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - id
              - amount
              - created_at
            default: created_at

        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc

      responses:
        '200':
          description: Transactions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionHistoryItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

        '400':
          description: Invalid query parameters

        '500':
          description: Internal server error

components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          example: '1'
        user_id:
          type: string
          example: '16'
        account_number:
          type: string
          example: 'QA-1234567890123456789012345678901'
        balance:
          type: string
          example: '0.00'
        created_at:
          type: string
          format: date-time
          example: '2026-11-12T17:19:52.758Z'

    Transaction:
      type: object
      required:
        - id
        - account_id
        - type
        - amount
        - created_at
        - balance
      properties:
        id:
          type: string
          example: '1'
        account_id:
          type: string
          example: '1'
        type:
          type: string
          enum:
            - DEPOSIT
            - WITHDRAWAL
        amount:
          type: string
          example: '50.00'
        created_at:
          type: string
          format: date-time
        balance:
          type: string
          description: Account balance after the transaction
          example: '150.00'

    TransactionHistoryItem:
      type: object
      required:
        - id
        - account_id
        - type
        - amount
        - created_at
      properties:
        id:
          type: string
          example: '101'
        account_id:
          type: string
          example: '15'
        type:
          type: string
          enum:
            - DEPOSIT
            - WITHDRAWAL
        amount:
          type: string
          example: '100.00'
        created_at:
          type: string
          format: date-time

    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8
