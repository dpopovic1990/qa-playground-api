
openapi: 3.0.3

info:
  title: QA Playground API
  version: 1.0.0
  description: |
    Open-source REST API playground for QA engineers,
    test automation practice and backend learning.

servers:
  - url: http://localhost:3000
    description: Local development environment

tags:
  - name: Health
  - name: Users
  - name: Accounts
    description: Account management operations

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        '200':
          description: API is running

  /api/v1/users:
    get:
      tags: [Users]
      summary: Get paginated users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: name
          in: query
          schema:
            type: string
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [id, name, created_at]
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Paginated users collection
        '400':
          description: Invalid query parameters

    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  example: John Doe
                email:
                  type: string
                  format: email
                  example: john@example.com
      responses:
        '201':
          description: User created successfully
        '400':
          description: Validation error
        '409':
          description: User already exists

  /api/v1/accounts:
    get:
      tags:
        - Accounts
      summary: Get all accounts
      description: Returns all accounts stored in PostgreSQL.
      responses:
        '200':
          description: Accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  count:
                    type: integer

    post:
      tags:
        - Accounts
      summary: Create an account
      description: Creates a new account for an existing user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  pattern: '^[1-9][0-9]*$'
                  example: '16'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          description: Invalid user ID
        '404':
          description: User not found
        '500':
          description: Internal server error

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: User found
        '400':
          description: Invalid user ID
        '404':
          description: User not found

components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: string
          example: '1'
        user_id:
          type: string
          example: '16'
        account_number:
          type: string
          example: 'QA-1234567890123456789012345678901'
        balance:
          type: string
          example: '0.00'
        created_at:
          type: string
          format: date-time
          example: '2026-11-12T17:19:52.758Z'